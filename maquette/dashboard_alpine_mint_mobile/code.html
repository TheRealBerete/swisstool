<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SwissTool Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e0e4da",
                        "error-container": "#ffdad6",
                        "surface-container": "#ebefe5",
                        "secondary-container": "#d9e6da",
                        "tertiary-container": "#387b41",
                        "primary-fixed-dim": "#88d982",
                        "on-surface-variant": "#40493d",
                        "tertiary-fixed-dim": "#90d792",
                        "on-secondary-fixed": "#131e17",
                        "outline": "#707a6c",
                        "surface-bright": "#f7fbf0",
                        "inverse-surface": "#2d322b",
                        "primary-container": "#2e7d32",
                        "on-tertiary-fixed": "#002107",
                        "surface-tint": "#1b6d24",
                        "on-primary-fixed": "#002204",
                        "tertiary-fixed": "#abf4ac",
                        "surface-variant": "#e0e4da",
                        "on-primary-container": "#cbffc2",
                        "surface": "#f7fbf0",
                        "surface-container-low": "#f1f5eb",
                        "on-primary-fixed-variant": "#005312",
                        "on-background": "#181d17",
                        "background": "#f7fbf0",
                        "on-secondary-fixed-variant": "#3e4a41",
                        "surface-container-high": "#e5eadf",
                        "surface-dim": "#d7dbd2",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#c7ffc5",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#0d631b",
                        "on-tertiary-fixed-variant": "#07521d",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface": "#181d17",
                        "inverse-on-surface": "#eef2e8",
                        "on-secondary-container": "#5b675e",
                        "secondary": "#556158",
                        "inverse-primary": "#88d982",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#d9e6da",
                        "on-primary": "#ffffff",
                        "outline-variant": "#bfcaba",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#bdcabe",
                        "primary-fixed": "#a3f69c",
                        "tertiary": "#1d622b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "container-margin": "40px",
                        "gutter": "24px",
                        "sm": "8px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex justify-between items-center px-md py-md z-40">
<div class="flex items-center gap-sm">
<img alt="SwissTool Logo" class="h-8 w-8 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLslkaNg0gCxnuG7ZhxC_CHl6ONY2484y4hQIBBdS-IYoVeBSHtCIqDeXLFzaCXr0ursFdkwlXGUbm5MAMHRhUFsLXLncWz_koxQiuRCQyJktwBN5ZjyNVo-MC3nUlbOYeFd-Q1rC-_naPQok6-xxfphJbdpqXdXLv_3EyLDPtzFZPOO44Zyq8ZG-2XC17cDLTSTwUu5Az1o344wmuoz43zHYvLILkK33NJLF3Ds9SjcXFCsrvSVqX-tmIs"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">SwissTool</h1>
</div>
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 p-md flex flex-col gap-md pb-32">
<!-- Status Indicator -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-sm flex items-center justify-center gap-sm">
<div class="w-2 h-2 rounded-full bg-primary-fixed-dim"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Desktop connected</span>
</div>
<!-- Shared Clipboard Card -->
<div class="bg-surface-container-lowest border border-[#F1F8E9] rounded-lg p-md flex flex-col gap-sm">
<div class="flex justify-between items-center border-b border-[#F1F8E9] pb-sm">
<div class="flex items-center gap-sm text-primary">
<span class="material-symbols-outlined" data-icon="content_paste">content_paste</span>
<h2 class="font-headline-sm text-headline-sm">Shared Clipboard</h2>
</div>
</div>
<div class="bg-surface-container-low p-sm rounded-DEFAULT border border-outline-variant min-h-[100px]">
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-3">
                    https://figma.com/file/swisstool-dashboard-design-v2...
                </p>
</div>
<div class="flex justify-end mt-sm">
<button class="bg-primary text-on-primary font-label-md text-label-md px-md py-sm rounded-DEFAULT flex items-center gap-xs hover:bg-surface-tint transition-colors active:translate-y-px">
<span class="material-symbols-outlined text-[16px]" data-icon="content_copy">content_copy</span>
                    Copy to device
                </button>
</div>
</div>
<!-- File Transfer Card -->
<div class="bg-surface-container-lowest border border-[#F1F8E9] rounded-lg p-md flex flex-col gap-sm">
<div class="flex justify-between items-center border-b border-[#F1F8E9] pb-sm">
<div class="flex items-center gap-sm text-primary">
<span class="material-symbols-outlined" data-icon="folder_shared">folder_shared</span>
<h2 class="font-headline-sm text-headline-sm">File Transfer</h2>
</div>
</div>
<div class="border border-dashed border-outline-variant rounded-DEFAULT p-lg flex flex-col items-center justify-center gap-sm bg-surface-container-low text-center">
<span class="material-symbols-outlined text-outline text-4xl" data-icon="upload_file">upload_file</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Tap to select a file from this device</p>
</div>
<div class="flex justify-end mt-sm">
<button class="border border-primary text-primary bg-transparent font-label-md text-label-md px-md py-sm rounded-DEFAULT flex items-center gap-xs hover:bg-surface-container-low transition-colors active:translate-y-px">
                    Select File
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-md py-sm pb-safe bg-surface border-t border-outline-variant z-50">
<!-- Clipboard (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="content_paste" style="font-variation-settings: 'FILL' 1;">content_paste</span>
<span class="font-label-md text-label-md mt-xs">Clipboard</span>
</button>
<!-- Files (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high rounded-xl active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="folder_shared">folder_shared</span>
<span class="font-label-md text-label-md mt-xs">Files</span>
</button>
<!-- Devices (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high rounded-xl active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="devices">devices</span>
<span class="font-label-md text-label-md mt-xs">Devices</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high rounded-xl active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md mt-xs">Settings</span>
</button>
</nav>
</body></html>
